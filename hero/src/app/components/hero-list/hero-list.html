<h1>Mission Control Center</h1>
<div class="container">
  @for (h of heroes(); track h.id) {
    <hero-card [hero]="h" (onMissionDone)="markAsDone($event)" (click) = "selectHero(h)">
    </hero-card>
  }
</div>

<hero-edit [editHero]="selectedHero()" (onAddHero)="addHero($event)"></hero-edit>
<p>Missioni completate: {{ totalCompleted() }}</p>
