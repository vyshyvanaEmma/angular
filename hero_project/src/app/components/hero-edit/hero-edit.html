<input [(ngModel)]="hero.id"
    name="nome" placeholder="id" />
<input [(ngModel)]="hero.nome"
    name="nome" placeholder="nome" />
<input [(ngModel)]="hero.potere"
    name="nome" placeholder="potere" />

<button 
  type="submit" 
  (click)="addHero()" 
  [disabled]="!hero.id || !hero.nome || !hero.potere"
  [style.opacity]="(!hero.id || !hero.nome || !hero.potere) ? 0.5 : 1"
  style="
    background: linear-gradient(135deg, #ff0000 0%, #b32400 100%);
    color: white; 
    padding: 6px 50px; 
    border: none; 
    border-radius: 6px; 
    cursor: pointer; 
    font-weight: 600; 
    font-size: 12px;
    display: inline-block;
    margin-top: 5px;
    box-shadow: 0 2px 5px rgba(0, 123, 255, 0.2);
    transition: all 0.2s ease;
    text-transform: uppercase;
  ">
  Salva 
</button>
{{hero | json}}
