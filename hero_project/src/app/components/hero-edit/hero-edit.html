<div class="form-box">
  <input [(ngModel)]="hero.id" name="id" placeholder="ID Eroe" type="number" />
  <input [(ngModel)]="hero.nome" name="nome" placeholder="Nome" />
  <input [(ngModel)]="hero.potere" name="potere" placeholder="Potere" />

  <button 
    class="btn-save"
    (click)="addHero()" 
    [disabled]="!hero.id || !hero.nome || !hero.potere">
    Salva Eroe
  </button>
</div>
