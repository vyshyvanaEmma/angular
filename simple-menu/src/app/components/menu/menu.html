<div class="menu-container">
  <h2>Ristorante "Angular Gourmet"</h2>
  
  <div class="menu-list">
    @for (p of piatti(); track p.id) {
      <app-dish-item
        [piatto]="p"
        (cambioQuantita)="aggiornaOrdine($event, p.id)">
      </app-dish-item>
    }
  </div>

  <hr>
  <footer class="total">
    <h3>Totale Conto: <span class="price">{{ totaleConto() }}€</span></h3>
  </footer>
</div>
